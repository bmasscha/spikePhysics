name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # postinstall vendors the MediaPipe Wasm runtime into public/wasm.
      - run: npm install --no-audit --no-fund

      - run: npm test

      - run: npm run typecheck

      # The chart panels collapsing to zero height is a layout bug, and jsdom has
      # no layout engine — only a real browser can catch a regression here.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      # The pose model is ~9 MB and deliberately not committed; fetch it here so
      # the deployed app can run live inference, not just the demo clip.
      - name: Fetch pose model
        run: |
          mkdir -p public/models
          curl -fL --retry 3 -o public/models/pose_landmarker_full.task \
            https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/latest/pose_landmarker_full.task

      - run: npm run build

      # Pages serves this repo from the gh-pages branch (that source was enabled
      # automatically when the branch first appeared). Publishing is therefore a
      # force-push of dist/ — no Pages API permissions needed.
      - name: Publish dist to gh-pages
        run: |
          cd dist
          touch .nojekyll                 # keep Jekyll's hands off the build
          cp index.html 404.html          # SPA fallback for deep links
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${{ github.sha }}"
          git push -f -q \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages
